<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Storefront</title>
  <link rel="stylesheet" href="/storefront.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Storefront</a>
    <a class="cart" href="#summary">Cart (2)</a>
  </header>
  <main class="shop">
    <section class="products" aria-label="Products">
      <article class="product"><div class="photo"></div><h2>Canvas tote</h2><p>$24.00</p></article>
      <article class="product"><div class="photo"></div><h2>Enamel mug</h2><p>$16.00</p></article>
      <article class="product"><div class="photo"></div><h2>Linen apron</h2><p>$38.00</p></article>
      <article class="product"><div class="photo"></div><h2>Oak board</h2><p>$42.00</p></article>
      <article class="product"><div class="photo"></div><h2>Wool throw</h2><p>$89.00</p></article>
      <article class="product"><div class="photo"></div><h2>Candle</h2><p>$18.00</p></article>
    </section>
    <aside class="summary" id="summary">
      <h2>Order summary</h2>
      <p>Subtotal $40.00</p>
      <p>Tax $3.20</p>
      <p>Total $43.20</p>
    </aside>
  </main>
</body>
</html>
